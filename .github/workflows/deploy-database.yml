name: Deploy Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
      - supabase/config.toml
      - .github/workflows/deploy-database.yml

permissions:
  contents: read

concurrency:
  group: deploy-database-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 推送数据库迁移
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 检查部署密钥
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 GitHub Actions Secret：${name}"
              exit 1
            fi
          done

      - name: 安装 Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: 显示 Supabase CLI 版本
        run: supabase --version

      - name: 关联 Supabase 项目
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: 预览待执行迁移
        run: supabase db push --dry-run

      - name: 推送迁移到远程数据库
        run: supabase db push
